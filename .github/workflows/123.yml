- name: Compile Metal Shader
  run: |
    cd Amethyst-prebuilt-libraries/SDL/SDL3/src/gpu/metal
    xcrun -sdk iphoneos metal -c Metal_Blit.metal -o Metal_Blit.air
    xcrun -sdk iphoneos metallib Metal_Blit.air -o Metal_Blit.metallib

- name: Upload metallib file
  uses: actions/upload-artifact@v4
  with:
    name: metal-shader
    path: Amethyst-prebuilt-libraries/SDL/SDL3/src/gpu/metal/Metal_Blit.metallib
